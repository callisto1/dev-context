# Knowledge Registry
# Each source is ingested into pgvector under source_type="knowledge".
#
# Supported source kinds:
#   git_docs    — clone a repo, ingest only the docs path (markdown/text)
#   git_full    — clone a repo, ingest all code and docs (no path filter)
#   web_docs    — crawl a documentation site starting from seed_url
#   confluence  — ingest pages from a Confluence Cloud space or by page ID
#
# git_docs and git_full sources reuse the existing GitIngester.
# git_docs uses include_patterns pointing at the docs directory.
# git_full ingests the entire repository with no path filter.
# web_docs sources use the WebDocsIngester.
# confluence sources use the ConfluenceIngester (requires CONFLUENCE_* env vars).

